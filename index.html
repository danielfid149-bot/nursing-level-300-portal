<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff5ca8"><title>Nursing Level 300 Portal</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);transition:.25s;background-image:radial-gradient(circle at 12% 8%,rgba(255,92,168,.16),transparent 22%),radial-gradient(circle at 88% 18%,rgba(255,92,168,.10),transparent 18%)}:root{--bg:#09090d;--card:#14141b;--card2:#1a1a23;--text:#fff;--muted:#aaa8b2;--line:#292933;--pink:#ff5ca8;--pink2:#ff87c0;--shadow:0 18px 50px rgba(0,0,0,.25)}body[data-theme="pink"]{--bg:#fff1f7;--card:#fff;--card2:#ffe4f0;--text:#27131e;--muted:#775d6b;--line:#f2cadc;--shadow:0 18px 50px rgba(122,33,75,.11)}body[data-theme="light"]{--bg:#f7f7fa;--card:#fff;--card2:#f0f0f5;--text:#17171b;--muted:#666671;--line:#dedee5;--shadow:0 18px 50px rgba(0,0,0,.08)}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}.shell{max-width:1050px;margin:auto;min-height:100vh}.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px}.mark{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,var(--pink),#ff9ccc);color:#fff;box-shadow:0 8px 24px rgba(255,92,168,.3)}.brand strong{display:block;font-size:14px}.brand span{font-size:11px;color:var(--muted)}.theme{border:1px solid var(--line);background:var(--card);color:var(--text);width:42px;height:42px;border-radius:14px;cursor:pointer}.page{padding:18px 18px 105px}.hero{position:relative;overflow:hidden;padding:26px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,var(--card),color-mix(in srgb,var(--pink) 10%,var(--card)));box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-75px;top:-85px;background:radial-gradient(circle,rgba(255,92,168,.42),transparent 67%);animation:float 7s ease-in-out infinite}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--pink2);font-weight:900}.hero h1{font-size:clamp(28px,7vw,54px);line-height:.98;margin:10px 0 12px;max-width:760px}.muted{color:var(--muted)}.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.pill{border:1px solid var(--line);background:var(--card2);padding:8px 10px;border-radius:999px;font-size:11px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.stat{padding:13px;background:color-mix(in srgb,var(--card) 75%,transparent);border:1px solid var(--line);border-radius:17px}.stat strong{display:block;font-size:21px}.stat span{font-size:10px;color:var(--muted)}.section-head{display:flex;align-items:end;justify-content:space-between;margin:26px 2px 10px}.section-head h2{margin:4px 0 0;font-size:22px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}.course{position:relative;overflow:hidden;cursor:pointer;transition:.2s;min-height:145px}.course:hover{transform:translateY(-2px)}.course:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,var(--pink))}.course h3{font-size:17px;margin:9px 0}.code{font-size:10px;color:var(--pink2);font-weight:900}.meta{display:grid;gap:5px;font-size:11px;color:var(--muted)}.day{margin-bottom:13px}.day-title{display:flex;justify-content:space-between;align-items:center;padding:0 3px 8px}.classrow{display:grid;grid-template-columns:105px 1fr;gap:12px;padding:14px;border-top:1px solid var(--line);cursor:pointer}.classrow:first-of-type{border-top:0}.time{font-size:10px;color:var(--pink2);font-weight:900}.classrow strong{font-size:13px}.classrow small{display:block;color:var(--muted);margin-top:3px}.lect{display:inline-block;margin-top:6px;padding:5px 8px;border-radius:999px;background:var(--card2);font-size:9px;color:var(--muted)}.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;width:min(96%,760px);display:grid;grid-template-columns:repeat(5,1fr);z-index:60;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;padding:7px;box-shadow:0 16px 55px rgba(0,0,0,.28)}.bottom button{background:none;border:0;color:var(--muted);display:grid;gap:3px;place-items:center;padding:6px 2px;font-size:9px;cursor:pointer}.bottom button b{font-size:17px}.bottom button.active{color:var(--pink)}.input,textarea,select{width:100%;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:14px;padding:12px;outline:none}textarea{min-height:125px;resize:vertical}.btn{border:0;border-radius:14px;background:linear-gradient(135deg,var(--pink),#ff8bc2);color:#fff;font-weight:900;padding:12px 15px;cursor:pointer}.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px;border-top:1px solid var(--line)}.task:first-child{border-top:0}.task.done .task-title{text-decoration:line-through;opacity:.6}.x{border:0;background:none;color:#f65;cursor:pointer}.upload{border:1px dashed color-mix(in srgb,var(--pink) 60%,var(--line));border-radius:18px;padding:20px;text-align:center;cursor:pointer;background:color-mix(in srgb,var(--pink) 5%,var(--card))}.file{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:12px}.file small{display:block;color:var(--muted);margin-top:3px}.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin-bottom:13px;cursor:pointer}.themes{display:flex;gap:8px;flex-wrap:wrap}.themes button{flex:1;min-width:90px;border:1px solid var(--line);border-radius:15px;padding:11px;background:var(--card2);color:var(--text);cursor:pointer}.bubble{position:fixed;border-radius:50%;pointer-events:none;z-index:-1;background:rgba(255,92,168,.09);animation:bubble 13s ease-in-out infinite}.b1{width:85px;height:85px;left:4%;top:28%}.b2{width:130px;height:130px;right:3%;top:57%;animation-delay:-5s}.b3{width:55px;height:55px;left:28%;bottom:14%;animation-delay:-9s}@keyframes bubble{50%{transform:translateY(-38px) translateX(14px) scale(1.08)}}@keyframes float{50%{transform:translateY(18px)}}@media(min-width:760px){.page{padding:28px 32px 115px}.grid{grid-template-columns:repeat(3,1fr)}.hero{padding:40px}.classrow{grid-template-columns:140px 1fr}.course{min-height:160px}}@media(max-width:430px){.grid{grid-template-columns:1fr}.hero{padding:22px}.stats{gap:5px}.stat{padding:10px}.classrow{grid-template-columns:90px 1fr}}
</style></head>
<body data-theme="dark"><div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div><div class="shell">
<header class="top"><a class="brand" href="#home"><div class="mark">N3</div><div><strong>Level 300 Nursing</strong><span>Student Portal</span></div></a><button class="theme" id="themeBtn">◐</button></header>
<main id="app" class="page"></main>
<nav class="bottom" id="nav"><button data-view="home"><b>⌂</b>Home</button><button data-view="timetable"><b>▦</b>Timetable</button><button data-view="courses"><b>♡</b>Courses</button><button data-view="tasks"><b>✓</b>Tasks</button><button data-view="files"><b>⌕</b>Files</button></nav>
</div>
<script>
const courses=[
{id:"community-nursing",title:"Community Nursing",day:"Monday",time:"7:00–9:30 AM",venue:"CH3-1",lecturer:"Mrs. Benedicta Bortey",accent:"#ff5ca8"},
{id:"biblical-foundation",title:"Biblical Foundation",day:"Monday",time:"2:00–4:30 PM",venue:"Baobab",lecturer:"Lecturer not provided",accent:"#ff84bd"},
{id:"surgical-crisis",title:"Surgical Crisis",day:"Tuesday",time:"7:00–9:30 AM",venue:"CH3-1",lecturer:"Mr. Alfred Yanful",accent:"#ff4f9a"},
{id:"skills-lab",title:"Skills Lab",day:"Tuesday",time:"10:00 AM–12:30 PM",venue:"Skills Lab",lecturer:"Mr. Adjei Jephta",accent:"#ff91c8"},
{id:"research-method",title:"Research Method",day:"Wednesday",time:"7:00–9:30 AM",venue:"AC3-1",lecturer:"Lecturer not provided",accent:"#ff6eae"},
{id:"french",title:"French",day:"Wednesday",time:"10:00 AM–12:30 PM",venue:"CH3-1",lecturer:"Mr. Dufordji",accent:"#ff9dce"},
{id:"medical-crisis",title:"Medical Crisis",day:"Thursday",time:"7:00–9:30 AM",venue:"AC3-1",lecturer:"Mr. William Menkah",accent:"#ff478f"},
{id:"adolescent-health",title:"Adolescent Health",day:"Thursday",time:"2:00–4:00 PM",venue:"CH3-1",lecturer:"Lecturer not provided",accent:"#ff79b7"},
{id:"transcultural-nursing",title:"Transcultural Nursing",day:"Friday",time:"10:00 AM–12:30 PM",venue:"CH3-1",lecturer:"Miss Flora",accent:"#ff5ca8"}];
const app=document.querySelector('#app'),nav=document.querySelector('#nav');
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
function courseCard(c){return '<article class="card course" style="--accent:'+c.accent+'" onclick="location.hash=\'course/'+c.id+'\'"><div class="code">'+c.day+' · '+c.time+'</div><h3>'+c.title+'</h3><div class="meta"><span>⌖ '+c.venue+'</span><span>♙ '+c.lecturer+'</span></div></article>'}
function hero(){return '<section class="hero"><div class="eyebrow">Nursing · Level 300</div><h1>Your semester, right in your pocket. 🩷</h1><p class="muted">Timetable, course workspaces, notes, assignments and documents — all in one mobile-first portal.</p><div class="pills"><span class="pill">9 courses</span><span class="pill">Pink · Black · White</span><span class="pill">Device-saved notes</span></div><div class="stats"><div class="stat"><strong>5</strong><span>class days</span></div><div class="stat"><strong>9</strong><span>courses</span></div><div class="stat"><strong>3</strong><span>themes</span></div></div></section>'}
function home(){const names=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],today=names[new Date().getDay()],tc=courses.filter(c=>c.day===today);app.innerHTML=hero()+'<div class="section-head"><div><div class="eyebrow">Today</div><h2>'+today+'</h2></div><a href="#timetable" class="muted">Full week →</a></div><section class="card">'+(tc.length?tc.map(classRow).join(''):'<p class="muted">No classes listed today.</p>')+'</section><div class="section-head"><div><div class="eyebrow">Course spaces</div><h2>Open a course</h2></div><a href="#courses" class="muted">See all →</a></div><section class="grid">'+courses.map(courseCard).join('')+'</section><div class="section-head"><div><div class="eyebrow">Quick note</div><h2>This week</h2></div></div><section class="card"><textarea id="quick" placeholder="Drop a quick study note here…"></textarea></section>';const q=document.querySelector('#quick');q.value=localStorage.quick||'';q.oninput=()=>localStorage.quick=q.value}
function classRow(c){return '<div class="classrow" onclick="location.hash=\'course/'+c.id+'\'"><div class="time">'+c.time+'</div><div><strong>'+c.title+'</strong><small>'+c.venue+'</small><span class="lect">'+c.lecturer+'</span></div></div>'}
function timetable(){const days=["Monday","Tuesday","Wednesday","Thursday","Friday"];app.innerHTML='<section class="hero"><div class="eyebrow">Weekly schedule</div><h1>Timetable</h1><p class="muted">Tap any class to open its course workspace.</p></section><div class="section-head"><div><h2>Monday → Friday</h2></div></div>'+days.map(d=>'<section class="card day"><div class="day-title"><strong>'+d+'</strong><span class="muted">'+courses.filter(c=>c.day===d).length+' classes</span></div>'+courses.filter(c=>c.day===d).map(classRow).join('')+'</section>').join('')}
function allCourses(){app.innerHTML='<section class="hero"><div class="eyebrow">All courses</div><h1>Course workspaces</h1><p class="muted">Open a course for class information, notes and documents.</p></section><div class="section-head"><div><h2>Level 300</h2></div></div><section class="grid">'+courses.map(courseCard).join('')+'</section>'}
function tasks(){let list=get('n3tasks',[]);app.innerHTML='<section class="hero"><div class="eyebrow">Deadlines</div><h1>Assignments</h1><p class="muted">Add tasks and tick them off as the semester moves.</p></section><div class="section-head"><div><h2>Add task</h2></div></div><section class="card"><input class="input" id="taskTitle" placeholder="Assignment or task"><div style="height:8px"></div><input class="input" id="taskDue" type="date"><div style="height:8px"></div><button class="btn" id="addTask">Add task</button></section><div class="section-head"><div><h2>Saved tasks</h2></div></div><section class="card" id="taskList"></section>';function render(){list=get('n3tasks',[]);document.querySelector('#taskList').innerHTML=list.length?list.map((t,i)=>'<div class="task '+(t.done?'done':'')+'"><input type="checkbox" data-check="'+i+'" '+(t.done?'checked':'')+'><div><b class="task-title">'+esc(t.title)+'</b><small class="muted">'+(t.due?esc(t.due):'No due date')+'</small></div><button class="x" data-del="'+i+'">×</button></div>').join(''):'<p class="muted">No assignments saved yet.</p>';document.querySelectorAll('[data-check]').forEach(x=>x.onchange=()=>{list[x.dataset.check].done=x.checked;set('n3tasks',list);render()});document.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{list.splice(x.dataset.del,1);set('n3tasks',list);render()})}render();document.querySelector('#addTask').onclick=()=>{const title=document.querySelector('#taskTitle').value.trim(),due=document.querySelector('#taskDue').value;if(!title)return;list.push({title,due,done:false});set('n3tasks',list);render();document.querySelector('#taskTitle').value=''}}
const DB='n3files';function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function saveFile(course,file,cat){const db=await openDB(),tx=db.transaction('files','readwrite');tx.objectStore('files').put({id:crypto.randomUUID(),course,name:file.name,type:file.type,size:file.size,cat,blob:file});return new Promise(r=>tx.oncomplete=r)}async function filesFor(course){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction('files').objectStore('files').getAll();r.onsuccess=()=>res(r.result.filter(x=>!course||x.course===course));r.onerror=()=>rej(r.error)})}async function delFile(id){const db=await openDB(),tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);return new Promise(r=>tx.oncomplete=r)}async function openFile(id){const fs=await filesFor();const f=fs.find(x=>x.id===id);if(!f)return;window.open(URL.createObjectURL(f.blob),'_blank')}
async function filesPage(){app.innerHTML='<section class="hero"><div class="eyebrow">Document library</div><h1>Resources</h1><p class="muted">Files uploaded inside any course appear here too.</p></section><div class="section-head"><div><h2>Saved files</h2></div></div><section class="card" id="allFiles"></section>';const fs=await filesFor();document.querySelector('#allFiles').innerHTML=fs.length?fs.map(f=>'<div class="file"><div><b>'+esc(f.name)+'</b><small>'+esc(courses.find(c=>c.id===f.course)?.title||f.course)+' · '+esc(f.cat||'Other')+'</small></div><div><button class="btn" style="padding:7px 9px" data-open="'+f.id+'">Open</button> <button class="x" data-del="'+f.id+'">×</button></div></div>').join(''):'<p class="muted">No files saved yet.</p>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openFile(b.dataset.open));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await delFile(b.dataset.del);filesPage()})}
async function courseView(id){const c=courses.find(x=>x.id===id);if(!c){allCourses();return}app.innerHTML='<span class="back" onclick="history.back()">← Back</span><section class="hero" style="border-color:'+c.accent+'55"><div class="eyebrow">'+c.day+' · '+c.time+'</div><h1>'+c.title+'</h1><p class="muted">⌖ '+c.venue+'<br>♙ '+c.lecturer+'</p></section><div class="section-head"><div><div class="eyebrow">Documents</div><h2>Course files</h2></div></div><section class="card"><select id="cat"><option>Lecture Notes</option><option>Slides</option><option>Assignments</option><option>Past Questions</option><option>Handouts</option><option>Other</option></select><div style="height:9px"></div><label class="upload" for="up"><b>＋ Upload document</b><p class="muted">Tap to choose files. They stay saved on this device.</p></label><input id="up" type="file" multiple hidden><div id="courseFiles"></div></section><div class="section-head"><div><div class="eyebrow">Personal notes</div><h2>My '+c.title+' notes</h2></div></div><section class="card"><textarea id="note" placeholder="Type notes here…"></textarea></section>';const note=document.querySelector('#note'),key='note_'+c.id;note.value=localStorage[key]||'';note.oninput=()=>localStorage[key]=note.value;async function render(){const fs=await filesFor(c.id);document.querySelector('#courseFiles').innerHTML=fs.length?fs.map(f=>'<div class="file"><div><b>'+esc(f.name)+'</b><small>'+esc(f.cat||'Other')+'</small></div><div><button class="btn" style="padding:7px 9px" data-open="'+f.id+'">Open</button> <button class="x" data-del="'+f.id+'">×</button></div></div>').join(''):'<p class="muted">No documents saved for this course yet.</p>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openFile(b.dataset.open));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await delFile(b.dataset.del);render()})}render();document.querySelector('#up').onchange=async e=>{for(const f of e.target.files)await saveFile(c.id,f,document.querySelector('#cat').value);render()}}
function themePanel(){app.innerHTML='<section class="hero"><div class="eyebrow">Appearance</div><h1>Choose your theme</h1><p class="muted">Pick the look that feels best on her phone.</p></section><div class="section-head"><div><h2>Themes</h2></div></div><section class="card themes"><button data-theme="dark">🖤 Black</button><button data-theme="pink">🩷 Pink</button><button data-theme="light">🤍 White</button></section>';document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{document.body.dataset.theme=b.dataset.theme;localStorage.n3theme=b.dataset.theme})}
function route(){const h=(location.hash||'#home').slice(1),parts=h.split('/'),view=parts[0];document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='home')home();else if(view==='timetable')timetable();else if(view==='courses')allCourses();else if(view==='tasks')tasks();else if(view==='files')filesPage();else if(view==='course')courseView(parts[1]);else if(view==='theme')themePanel();else home();window.scrollTo(0,0)}
nav.querySelectorAll('button').forEach(b=>b.onclick=()=>location.hash=b.dataset.view);document.querySelector('#themeBtn').onclick=()=>location.hash='theme';document.body.dataset.theme=localStorage.n3theme||'dark';addEventListener('hashchange',route);route();
</script></body></html>

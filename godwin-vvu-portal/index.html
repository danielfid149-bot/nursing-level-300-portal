<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f0b63">
<title>Godwin · VVU Student Portal</title>
<style>
:root{--bg:#09060f;--panel:#14101f;--panel2:#1d162b;--text:#fff;--muted:#aaa0bd;--line:rgba(255,255,255,.1);--purple:#5a168f;--purple2:#8d55c8;--gold:#e6b936;--shadow:0 20px 65px rgba(0,0,0,.34)}
:root.light{--bg:#f7f4fb;--panel:#fff;--panel2:#f1eaf8;--text:#1c1228;--muted:#756985;--line:rgba(54,25,86,.12);--shadow:0 18px 50px rgba(48,20,75,.12)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}button,input,textarea,select{font:inherit}button{color:inherit}a{color:inherit;text-decoration:none}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-1;background:radial-gradient(circle at 8% 8%,rgba(90,22,143,.28),transparent 29%),radial-gradient(circle at 91% 16%,rgba(230,185,54,.14),transparent 22%),radial-gradient(circle at 52% 92%,rgba(141,85,200,.16),transparent 27%)}
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.sidebar{height:100vh;position:sticky;top:0;border-right:1px solid var(--line);padding:22px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);display:flex;flex-direction:column;z-index:30}.brand{display:flex;align-items:center;gap:12px;padding:4px 7px 24px}.mark{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-weight:900;color:#351051;background:linear-gradient(140deg,var(--gold),#ffd96a);box-shadow:0 10px 30px rgba(230,185,54,.22)}.brand b{display:block}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.nav{display:grid;gap:7px}.nav a{padding:12px 13px;border-radius:13px;color:var(--muted);font-size:13px;font-weight:800;transition:.2s}.nav a:hover,.nav a.active{background:linear-gradient(100deg,rgba(90,22,143,.22),rgba(230,185,54,.08));color:var(--text);transform:translateX(3px)}.side-bottom{margin-top:auto;display:grid;gap:10px}.ghost,.btn,.danger{border-radius:12px;padding:10px 13px;font-weight:800;font-size:12px;cursor:pointer}.ghost{border:1px solid var(--line);background:var(--panel)}.btn{border:0;background:linear-gradient(135deg,var(--gold),#f2ce67);color:#301645}.danger{border:1px solid rgba(255,105,135,.28);background:rgba(255,105,135,.12);color:#ff9daf}.full{width:100%}
.mobile{display:none;height:62px;padding:0 15px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);position:sticky;top:0;z-index:25}.main{min-width:0}.page{max-width:1450px;margin:auto;padding:34px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:22px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:10px;font-weight:900;color:var(--gold)}h1{font-size:clamp(32px,5vw,56px);line-height:1;margin:7px 0 10px;letter-spacing:-.045em}.sub{color:var(--muted);line-height:1.65;max-width:770px;margin:0;font-size:14px}.pill{border:1px solid var(--line);background:var(--panel);padding:9px 12px;border-radius:999px;font-size:11px;color:var(--muted)}
.grid12{display:grid;grid-template-columns:repeat(12,1fr);gap:15px}.card{background:linear-gradient(165deg,var(--panel),color-mix(in srgb,var(--panel2) 88%,transparent));border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero{grid-column:span 8;padding:28px}.hero2{grid-column:span 4}.hero h2{font-size:31px;line-height:1.08;margin:8px 0 10px}.glow{position:absolute;width:300px;height:300px;right:-110px;top:-150px;border-radius:50%;background:radial-gradient(circle,rgba(230,185,54,.24),transparent 67%)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:20px}.metric{padding:13px;border-radius:15px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel2) 80%,transparent)}.metric b{display:block;font-size:22px}.metric span{font-size:10px;color:var(--muted)}.section{margin:26px 2px 11px;display:flex;align-items:end;justify-content:space-between}.section h2{margin:4px 0 0;font-size:21px}.course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.course{cursor:pointer;min-height:180px;transition:.2s}.course:hover{transform:translateY(-5px);border-color:rgba(230,185,54,.35)}.course:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,var(--gold));box-shadow:0 0 18px var(--accent,var(--gold))}.course h3{margin:8px 0 10px;font-size:17px;line-height:1.25}.meta{font-size:11px;line-height:1.7;color:var(--muted)}.timetable{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:11px;min-width:1080px}.scroll{overflow:auto}.day h3{font-size:13px;margin:0 0 10px}.class{display:block;padding:13px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px}.class .time{font-size:10px;font-weight:900;color:var(--gold)}.class b{display:block;font-size:12px;margin:5px 0}.class small{font-size:10px;color:var(--muted)}.free{display:grid;place-items:center;text-align:center;min-height:120px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:11px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.input,.select,.notes{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:11px;outline:none}.notes{min-height:190px;resize:vertical}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px;border-top:1px solid var(--line)}.task:first-child{border-top:0}.task.done .tt{text-decoration:line-through;opacity:.55}.task small{display:block;color:var(--muted);margin-top:3px}.x{border:0;background:none;color:#ff809b;cursor:pointer}.upload{border:1.5px dashed rgba(230,185,54,.35);border-radius:17px;padding:22px;text-align:center;background:rgba(230,185,54,.04);cursor:pointer}.files{display:grid;gap:8px;margin-top:13px}.file{display:grid;grid-template-columns:1fr auto;gap:10px;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);font-size:12px}.file small{display:block;color:var(--muted);margin-top:3px}.footer{text-align:center;color:var(--muted);font-size:10px;margin:34px 0 8px}.hide{display:none!important}
@media(max-width:1050px){.shell{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:0;width:260px;transform:translateX(-105%);transition:.22s;box-shadow:var(--shadow)}.sidebar.open{transform:none}.mobile{display:flex}.page{padding:22px 16px}.hero,.hero2{grid-column:1/-1}.course-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.grid12{display:block}.card{margin-bottom:13px}.course-grid,.two{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}.top{flex-direction:column}.page{padding-bottom:40px}.course{min-height:auto}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="shell">
<aside class="sidebar" id="sidebar">
  <a class="brand" href="#/dashboard"><div class="mark">VVU</div><div><b>Godwin's Portal</b><small>BIT · Level 100</small></div></a>
  <nav class="nav" id="nav">
    <a href="#/dashboard" data-page="dashboard">⌂ Dashboard</a>
    <a href="#/timetable" data-page="timetable">▦ Timetable</a>
    <a href="#/courses" data-page="courses">◫ Courses</a>
    <a href="#/assignments" data-page="assignments">✓ Assignments</a>
    <a href="#/resources" data-page="resources">⌕ Resources</a>
  </nav>
  <div class="side-bottom"><button class="ghost full" id="theme">◐ Toggle theme</button></div>
</aside>
<div class="main">
<header class="mobile"><button class="ghost" id="menu">☰</button><b>Godwin · VVU</b><span class="pill">BIT L100</span></header>
<main class="page" id="app"></main>
</div>
</div>
<script>
const courses=[
{id:'it-foundation',title:'Information Technology Foundation',day:'Monday',time:'7:00–9:30 AM',venue:'Venue TBA',accent:'#e6b936'},
{id:'life-jesus',title:'Life and Teachings of Jesus',day:'Monday',time:'10:00 AM–12:30 PM',venue:'American High',accent:'#8d55c8'},
{id:'programming',title:'Elements of Programming',day:'Monday',time:'2:00–4:30 PM',venue:'CS3',accent:'#58c9b9'},
{id:'physical-activity',title:'Physical Activity',day:'Monday',time:'5:00–6:30 PM',venue:'Basketball Court',accent:'#f39c5a'},
{id:'english',title:'Language and Writing Skills I',day:'Tuesday',time:'10:00 AM–12:30 PM',venue:'Baobab RM3',accent:'#ec7063'},
{id:'study-skills',title:'Study Skills',day:'Tuesday',time:'4:30–5:30 PM',venue:'American High',accent:'#5dade2'},
{id:'french',title:'French for General Communication I',day:'Wednesday',time:'7:00–9:30 AM',venue:'Baobab RM1',accent:'#af7ac5'},
{id:'critical-thinking',title:'Critical Thinking and Practical Reasoning',day:'Wednesday',time:'3:00–5:00 PM',venue:'CS3',accent:'#48c9b0'},
{id:'algebra',title:'Algebra',day:'Thursday',time:'10:00 AM–12:30 PM',venue:'CS3',accent:'#f4d03f'}
];
const days=['Monday','Tuesday','Wednesday','Thursday','Friday'];
const app=document.getElementById('app'),sidebar=document.getElementById('sidebar');
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const getTasks=()=>{try{return JSON.parse(localStorage.getItem('godwin-vvu-tasks')||'[]')}catch{return[]}};
const saveTasks=x=>localStorage.setItem('godwin-vvu-tasks',JSON.stringify(x));
const cBy=id=>courses.find(c=>c.id===id);
function header(eye,title,sub,extra=''){return '<div class="top"><div><div class="eyebrow">'+eye+'</div><h1>'+title+'</h1><p class="sub">'+sub+'</p></div>'+extra+'</div>'}
function foot(){return '<div class="footer">Godwin · Valley View University · BIT Level 100</div>'}
function setNav(p){document.querySelectorAll('[data-page]').forEach(a=>a.classList.toggle('active',a.dataset.page===p))}
function card(c){return '<article class="card course" style="--accent:'+c.accent+'" onclick="location.hash=\'#/course/'+c.id+'\'"><div class="eyebrow">'+c.day+' · '+c.time+'</div><h3>'+c.title+'</h3><div class="meta">⌖ '+c.venue+'<br>♙ Lecturer TBA</div></article>'}
function dashboard(){setNav('dashboard');const today=new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}),todayName=new Date().toLocaleDateString(undefined,{weekday:'long'}),todayClasses=courses.filter(c=>c.day===todayName);app.innerHTML=header('Valley View University','Welcome, Godwin.','Your BIT Level 100 semester dashboard — timetable, course spaces, assignments, notes and files in one place.','<span class="pill">📅 '+today+'</span>')+'<section class="grid12"><div class="card hero"><div class="glow"></div><div class="eyebrow">First Year · Semester 1</div><h2>Study smarter, stay organised.</h2><p class="sub">Everything here saves locally on this device, so your notes, assignments and uploaded files stay with you.</p><div class="metrics"><div class="metric"><b>9</b><span>courses</span></div><div class="metric"><b>4</b><span>class days</span></div><div class="metric"><b>20</b><span>programme credits listed</span></div></div></div><div class="card hero2"><div class="eyebrow">Today</div><h3>'+(todayClasses.length?todayClasses.length+' class'+(todayClasses.length>1?'es':''):'No listed classes')+'</h3><p class="sub">'+(todayClasses.length?todayClasses.map(c=>c.time+' · '+c.title).join('<br>'):'Use the free time for review, assignments or prep.')+'</p></div></section><div class="section"><div><div class="eyebrow">Course spaces</div><h2>Jump into a course</h2></div><a href="#/courses" class="pill">See all →</a></div><section class="course-grid">'+courses.slice(0,6).map(card).join('')+'</section>'+foot()}
function timetable(){setNav('timetable');app.innerHTML=header('Weekly schedule','Class timetable','Your supplied BIT Level 100 first-semester timetable. Course codes are intentionally omitted.')+'<section class="card scroll"><div class="timetable">'+days.map(d=>'<div class="day"><h3>'+d+'</h3>'+(courses.filter(c=>c.day===d).length?courses.filter(c=>c.day===d).map(c=>'<a class="class" href="#/course/'+c.id+'"><span class="time">'+c.time+'</span><b>'+c.title+'</b><small>'+c.venue+'</small></a>').join(''):'<div class="free">✨<br>No listed classes</div>')+'</div>').join('')+'</div></section>'+foot()}
function allCourses(){setNav('courses');app.innerHTML=header('Semester 1','Courses','Open any course to keep notes and documents together.')+'<section class="course-grid">'+courses.map(card).join('')+'</section>'+foot()}
function assignments(){setNav('assignments');app.innerHTML=header('Deadline tracker','Assignments','Add tasks, due dates and tick them off as you go.')+'<section class="card"><div class="two"><input class="input" id="taskTitle" placeholder="Assignment or task"><select class="select" id="taskCourse">'+courses.map(c=>'<option value="'+c.id+'">'+c.title+'</option>').join('')+'</select></div><div class="toolbar" style="margin-top:9px"><input class="input" id="taskDue" type="date" style="max-width:220px"><button class="btn" id="addTask">Add task</button></div><div id="taskList" style="margin-top:12px"></div></section>'+foot();drawTasks();document.getElementById('addTask').onclick=()=>{const title=document.getElementById('taskTitle').value.trim();if(!title)return;const t=getTasks();t.unshift({id:crypto.randomUUID(),title,course:document.getElementById('taskCourse').value,due:document.getElementById('taskDue').value,done:false});saveTasks(t);document.getElementById('taskTitle').value='';drawTasks()}}
function drawTasks(){const h=document.getElementById('taskList');if(!h)return;const t=getTasks();h.innerHTML=t.length?t.map(x=>'<div class="task '+(x.done?'done':'')+'"><input type="checkbox" data-check="'+x.id+'" '+(x.done?'checked':'')+'><div><b class="tt">'+esc(x.title)+'</b><small>'+esc(cBy(x.course)?.title||'Course')+(x.due?' · '+esc(x.due):'')+'</small></div><button class="x" data-del="'+x.id+'">×</button></div>').join(''):'<p class="sub">No assignments saved yet.</p>';h.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{const t=getTasks(),i=t.findIndex(x=>x.id===e.dataset.check);if(i>-1){t[i].done=e.checked;saveTasks(t);drawTasks()}});h.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{saveTasks(getTasks().filter(x=>x.id!==e.dataset.del));drawTasks()})}
const DB='godwin-vvu-files';function db(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function files(course){const d=await db();return new Promise((res,rej)=>{const r=d.transaction('files').objectStore('files').getAll();r.onsuccess=()=>res(r.result.filter(x=>!course||x.course===course));r.onerror=()=>rej(r.error)})}async function saveFile(course,file){const d=await db(),tx=d.transaction('files','readwrite');tx.objectStore('files').put({id:crypto.randomUUID(),course,name:file.name,type:file.type,blob:file});return new Promise(r=>tx.oncomplete=r)}async function delFile(id){const d=await db(),tx=d.transaction('files','readwrite');tx.objectStore('files').delete(id);return new Promise(r=>tx.oncomplete=r)}async function openF(id){const all=await files(),f=all.find(x=>x.id===id);if(f)window.open(URL.createObjectURL(f.blob),'_blank')}
async function resources(){setNav('resources');app.innerHTML=header('Local library','Resources','Every document uploaded inside a course also appears here.')+'<section class="card"><div id="allFiles" class="files"></div></section>'+foot();const f=await files();const h=document.getElementById('allFiles');h.innerHTML=f.length?f.map(x=>'<div class="file"><div><b>'+esc(x.name)+'</b><small>'+esc(cBy(x.course)?.title||'Course')+'</small></div><div><button class="ghost" data-open="'+x.id+'">Open</button> <button class="x" data-del="'+x.id+'">×</button></div></div>').join(''):'<p class="sub">No uploaded files yet.</p>';h.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openF(b.dataset.open));h.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await delFile(b.dataset.del);resources()})}
async function coursePage(id){const c=cBy(id);if(!c){location.hash='#/courses';return}setNav('courses');app.innerHTML=header(c.day+' · '+c.time,c.title,c.venue+' · Lecturer TBA','<a class="pill" href="#/courses">← Courses</a>')+'<section class="two"><div class="card"><div class="eyebrow">Personal notes</div><h3>My notes</h3><textarea class="notes" id="note" placeholder="Type '+esc(c.title)+' notes here…"></textarea></div><div class="card"><div class="eyebrow">Documents</div><h3>Course files</h3><label class="upload" for="picker"><b>＋ Upload document</b><p class="sub">PDF, Word, PowerPoint or image.</p></label><input id="picker" type="file" multiple hidden><div id="courseFiles" class="files"></div></div></section>'+foot();const key='godwin-note-'+id,n=document.getElementById('note');n.value=localStorage.getItem(key)||'';n.oninput=()=>localStorage.setItem(key,n.value);async function render(){const f=await files(id),h=document.getElementById('courseFiles');h.innerHTML=f.length?f.map(x=>'<div class="file"><div><b>'+esc(x.name)+'</b></div><div><button class="ghost" data-open="'+x.id+'">Open</button> <button class="x" data-del="'+x.id+'">×</button></div></div>').join(''):'<p class="sub">No files uploaded yet.</p>';h.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openF(b.dataset.open));h.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await delFile(b.dataset.del);render()})}render();document.getElementById('picker').onchange=async e=>{for(const f of e.target.files)await saveFile(id,f);render()}}
function route(){const p=(location.hash||'#/dashboard').replace(/^#\//,'').split('/');if(p[0]==='dashboard')dashboard();else if(p[0]==='timetable')timetable();else if(p[0]==='courses')allCourses();else if(p[0]==='assignments')assignments();else if(p[0]==='resources')resources();else if(p[0]==='course')coursePage(p[1]);else dashboard();sidebar.classList.remove('open');window.scrollTo(0,0)}
document.getElementById('menu').onclick=()=>sidebar.classList.toggle('open');document.getElementById('theme').onclick=()=>{document.documentElement.classList.toggle('light');localStorage.setItem('godwin-theme',document.documentElement.classList.contains('light')?'light':'dark')};if(localStorage.getItem('godwin-theme')==='light')document.documentElement.classList.add('light');addEventListener('hashchange',route);route();
</script>
</body>
</html>

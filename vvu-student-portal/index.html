<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080c18" />
  <title>My VVU Portal · V2</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="cursor-glow" aria-hidden="true"></div>
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard" aria-label="Go to dashboard">
        <span class="brand-mark">VV</span>
        <span><b>My VVU Portal</b><small>Local V2 · 2026/27</small></span>
      </a>
      <nav id="mainNav" class="nav"></nav>
      <div class="sidebar-bottom">
        <div class="storage-card"><span>Local storage</span><b id="storageUsage">Checking…</b><div class="storage-track"><i id="storageBar"></i></div></div>
        <button class="ghost-btn full" id="themeBtn" type="button">◐ Toggle theme</button>
      </div>
    </aside>
    <div class="main-wrap">
      <header class="mobile-header">
        <button class="icon-btn" id="menuBtn" aria-label="Open navigation">☰</button>
        <a class="mini-brand" href="#/dashboard">VVU Portal</a>
        <span class="status-chip"><i></i>Local</span>
      </header>
      <main id="app" class="page-root" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="confirmDialog" class="modal">
    <form method="dialog">
      <h3 id="confirmTitle">Confirm</h3><p id="confirmText"></p>
      <div class="modal-actions"><button value="cancel" class="ghost-btn">Cancel</button><button value="ok" class="danger-btn">Delete</button></div>
    </form>
  </dialog>
  <div id="toastHost" class="toast-host" aria-live="polite"></div>
  <script src="assets/app.js"></script>
</body>
</html>
